<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="brand"><div class="logo">CF</div><div><h1>Cris Financeiro</h1><p>Acesso protegido</p></div></div>
    <form id="authForm">
      <label>Senha de acesso</label>
      <input id="authPass" class="field" type="password" minlength="6" autocomplete="current-password" required autofocus />
      <button class="btn full" id="authSubmit" type="submit">Entrar</button>
    </form>
    <div class="msg" id="authMsg">Digite a senha de acesso para entrar no sistema.</div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="sidebar">

</div>

<div id="toast" class="toast hidden"></div>
<div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">

    <div class="modal-head"><h3 id="editTitle">Editar</h3><button id="editClose" class="modal-close" type="button" aria-label="Fechar">×</button></div>

      <div id="editBody" class="modal-body formgrid"></div>
      <div class="modal-actions"><button id="editCancel" class="btn secondary" type="button">Cancelar</button><button id="editSave" class="btn" type="submit">Salvar alterações</button></div>
    </form>
  </div>
</div>

<script>
window.addEventListener('error',function(e){
  var box=document.getElementById('runtimeError');
  if(box){
    box.style.display='block';
    box.textContent='Erro ao abrir o sistema: '+(e.message||'erro desconhecido');
  }
});
window.addEventListener('unhandledrejection',function(e){
  var box=document.getElementById('runtimeError');
  if(box){
    box.style.display='block';
    box.textContent='Erro ao carregar o sistema: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason||'erro desconhecido'));
  }
});
</script>
<div id="runtimeError" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;background:#fff3cd;color:#6b4e00;border:1px solid #e0c56e;border-radius:12px;padding:12px 14px;font:14px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.12)"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const SUPABASE_URL='https://nxjtninxbikekdcufdqz.supabase.co';
const SUPABASE_KEY='sb_publishable_SOpFBEWN_nOMWFLsCpcKfA_akvfFFWG';
const AUTH_USER_ID='a7b397b7-55b9-41c6-8379-0a599c216377';
let appPassword=sessionStorage.getItem('cris_finance_password')||'';
const financeFetch=async(url,opts={})=>{
  const headers=new Headers(opts.headers||{});
  if(appPassword) headers.set('x-finance-password',appPassword);
  return fetch(url,{...opts,headers});
};
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},global:{fetch:financeFetch}});
function opts(items,selected){return (items||[]).map(v=>{const value=Array.isArray(v)?v[0]:v;const label=Array.isArray(v)?v[1]:v;return '<option value="'+esc(value)+'" '+(String(value)===String(selected)?'selected':'')+'>'+esc(label)+'</option>'}).join('')} const $=s=>document.querySelector(s); const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const dbr=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—'; const isoToday=()=>new Date().toISOString().slice(0,10); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let signup=false, user={id:AUTH_USER_ID}, page='dashboard', taxTypeFilter='Estadual', reportMode='cashflow';
let data={suppliers:[],payables:[],payments:[],income:[],expenses:[],receivables:[],receivablePayments:[],fuel:[]};
const pages=[['dashboard','Visão geral'],['payables','Contas a pagar'],['receivables','Contas a receber'],['taxes','Impostos'],['suppliers','Fornecedores'],['income','Entradas'],['expenses','Saídas'],['reports','Relatórios gerenciais'],['debts','Mapa das dívidas'],['gasoline','⛽ Gasolina']];
function toast(t){const el=$('#toast');if(!el)return;el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el?.classList.add('hidden'),2800)}
function closeEditor(){const m=$('#editModal');if(!m)return;m.classList.add('hidden');$('#editForm').onsubmit=null;const save=$('#editSave');if(save){save.classList.remove('hidden');save.disabled=false;save.textContent='Salvar alterações'}const cancel=$('#editCancel');if(cancel)cancel.textContent='Cancelar'}
function openEditor(title,html,onSave){const m=$('#editModal'),form=$('#editForm'),save=$('#editSave');if(!m||!form||!save){toast('Não foi possível abrir esta janela.');return}$('#editTitle').textContent=title;$('#editBody').innerHTML=html;m.classList.remove('hidden');save.classList.remove('hidden');save.disabled=false;save.textContent='Salvar alterações';if($('#editCancel'))$('#editCancel').textContent='Cancelar';form.onsubmit=async e=>{e.preventDefault();save.disabled=true;save.textContent='Salvando...';try{const ok=await onSave(new FormData(form));if(ok!==false)closeEditor()}catch(err){console.error(err);toast('Não foi possível salvar as alterações.')}finally{save.disabled=false;save.textContent='Salvar alterações'}};setTimeout(()=>form.querySelector('input,select,textarea')?.focus(),30)}
function navRender(){const html=pages.map(p=>'<button type="button" data-page="'+p[0]+'" class="'+(page===p[0]?'active':'')+'">'+p[1]+'</button>').join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;history.replaceState(null,'','#'+page);navRender();render()}))}
function showAuth(msg=''){const auth=$('#auth'),app=$('#app');if(auth)auth.classList.remove('hidden');if(app)app.classList.add('hidden');if(msg)$('#authMsg').textContent=msg;const pass=$('#authPass');if(pass){pass.value='';pass.focus()}}
function clearAccess(){appPassword='';sessionStorage.removeItem('cris_finance_password');}
async function tryAccess(password){
  appPassword=String(password||'');
  if(!appPassword){showAuth('Digite a senha de acesso.');return false}
  sessionStorage.setItem('cris_finance_password',appPassword);
  $('#authSubmit').disabled=true;$('#authMsg').textContent='Verificando...';
  const q=await sb.from('suppliers').select('id').limit(1);

    clearAccess();

    showAuth('Senha incorreta.');

  }
  user={id:AUTH_USER_ID};
  $('#authSubmit').disabled=false;
  const auth=$('#auth'),app=$('#app');if(auth)auth.classList.add('hidden');if(app)app.classList.remove('hidden');
  await boot();
  return true;
}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();await tryAccess($('#authPass').value)});
async function boot(){user={id:AUTH_USER_ID};const hp=location.hash.replace('#','');if(pages.some(p=>p[0]===hp))page=hp;const app=$('#app'),today=$('#todayLabel');if(app)app.classList.remove('hidden');if(today)today.textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});navRender();await loadAll()}
$('#editClose').addEventListener('click',closeEditor);$('#editCancel').addEventListener('click',closeEditor);$('#editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#editModal').classList.contains('hidden'))closeEditor()});$('#refresh').addEventListener('click',loadAll);$('#logout').addEventListener('click',()=>{clearAccess();location.reload()});
window.addEventListener('hashchange',()=>{const hp=location.hash.replace('#','');if(pages.some(p=>p[0]===hp)&&hp!==page){page=hp;navRender();render()}});const savedPass=sessionStorage.getItem('cris_finance_password');if(savedPass){appPassword=savedPass;tryAccess(savedPass)}else{showAuth()}

async function loadAll(){
  if(!appPassword){showAuth();return false}
  if(!user) user={id:AUTH_USER_ID};

function attachmentPaths(value){if(!value)return[];if(Array.isArray(value))return value.filter(Boolean);if(typeof value==='string'&&value.trim().startsWith('[')){try{const v=JSON.parse(value);return Array.isArray(v)?v.filter(Boolean):[value]}catch(e){}}return[String(value)]}
function attachmentValue(paths){const arr=(paths||[]).filter(Boolean);return arr.length?JSON.stringify(arr):null}
async function uploadAttachmentFiles(files,basePath){const list=Array.from(files||[]).filter(x=>x&&x.size),paths=[];for(const file of list){const ok=file.type==='application/pdf'||String(file.type||'').startsWith('image/');if(!ok){toast('Anexe apenas imagens ou PDFs.');if(paths.length)await sb.storage.from('financeiro').remove(paths);throw new Error('__VALIDATION__')}const path=basePath+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('financeiro').upload(path,file,{contentType:file.type||undefined,upsert:false});if(up.error){if(paths.length)await sb.storage.from('financeiro').remove(paths);throw up.error}paths.push(path)}return paths}

function validReceiptFile(file){
  if(!file||!file.size)return true;
  const okType=file.type==='application/pdf'||String(file.type||'').startsWith('image/');
  if(!okType){toast('Anexe uma imagem ou PDF.');return false}
  if(file.size>10*1024*1024){toast('O comprovante deve ter no máximo 10 MB.');return false}

}
async function uploadPaymentReceipt(file,payableId){
  if(!file||!file.size)return null;
  if(!validReceiptFile(file))throw new Error('__VALIDATION__');

  const path=user.id+'/pagamentos/'+payableId+'/'+crypto.randomUUID()+'-'+safe;
  const up=await sb.storage.from('financeiro').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(up.error)throw up.error;

}

  $('#content').innerHTML='<div class="formbox"><div class="section-title"><h3>Novo fornecedor</h3></div><form id="supplierForm"><div class="formgrid"><div><label>Nome</label><input class="field" name="name" required /></div><div><label>CNPJ/CPF</label><input class="field" name="document" /></div><div><label>Telefone / WhatsApp</label><input class="field" name="phone" /></div><div><label>Contato</label><input class="field" name="contact_name" /></div><div class="span2"><label>Observação</label><input class="field" name="notes" /></div></div><div class="form-actions"><button class="btn" type="submit">Salvar fornecedor</button></div></form></div><div class="list">'+(data.suppliers.length?data.suppliers.map(s=>{const ps=data.payables.filter(p=>p.supplier_id===s.id),open=ps.reduce((a,p)=>a+payableBal(p),0),paid=ps.reduce((a,p)=>a+paidFor(p.id),0);return '<div class="row"><div><div class="title">'+esc(s.name)+'</div><div class="sub">'+esc(s.phone||'Sem telefone')+'</div></div><div><div class="sub">Já pago</div><strong>'+money(paid)+'</strong></div><div class="money">Devemos '+money(open)+'</div><div class="actions"><button class="btn secondary small" data-editsupplier="'+s.id+'">Editar</button><button class="btn danger small" data-delsupplier="'+s.id+'">Excluir</button></div></div>'}).join(''):'<div class="empty">Cadastre seus fornecedores para saber exatamente quanto deve a cada um.</div>')+'</div>';
  $('#supplierForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),q=await sb.from('suppliers').insert({user_id:user.id,name:f.get('name'),document:f.get('document')||null,phone:f.get('phone')||null,contact_name:f.get('contact_name')||null,notes:f.get('notes')||null});if(q.error)toast(q.error.message);else{toast('Fornecedor salvo');await loadAll()}});
  document.querySelectorAll('[data-editsupplier]').forEach(b=>b.addEventListener('click',()=>editSupplier(b.dataset.editsupplier)));
  document.querySelectorAll('[data-delsupplier]').forEach(b=>b.addEventListener('click',()=>deleteRow('suppliers',b.dataset.delsupplier,'Excluir fornecedor? As contas existentes ficarão sem fornecedor.')))
}
function editSupplier(id){
  const s=data.suppliers.find(x=>x.id===id);if(!s)return;
  openEditor('Editar fornecedor','<div><label>Nome</label><input class="field" name="name" required value="'+esc(s.name||'')+'" /></div><div><label>CNPJ/CPF</label><input class="field" name="document" value="'+esc(s.document||'')+'" /></div><div><label>Telefone / WhatsApp</label><input class="field" name="phone" value="'+esc(s.phone||'')+'" /></div><div><label>Contato</label><input class="field" name="contact_name" value="'+esc(s.contact_name||'')+'" /></div><div class="span2"><label>Observação</label><textarea class="field" name="notes">'+esc(s.notes||'')+'</textarea></div>',async f=>{const name=String(f.get('name')||'').trim();if(!name){toast('Preencha o nome do fornecedor.');return false}const q=await sb.from('suppliers').update({name,document:f.get('document')||null,phone:f.get('phone')||null,contact_name:f.get('contact_name')||null,notes:f.get('notes')||null}).eq('id',id);if(q.error){toast(q.error.message);return false}toast('Fornecedor atualizado');await loadAll();return true})
}

function renderSimpleLedger(type,title,listTitle,cats){
  const arr=data[type],fuelExpenseIds=new Set((data.fuel||[]).map(f=>f.expense_id).filter(Boolean));
  $('#content').innerHTML='<div class="notice"><strong>'+(type==='expenses'?'Pagamentos de boletos e abastecimentos já entram automaticamente nas saídas.':'Você pode lançar só o total do caixa do dia, se preferir.')+'</strong>'+(type==='expenses'?'Use esta área para outros gastos avulsos. Abastecimentos são gerenciados na aba Gasolina para evitar duplicidade.':'Não é obrigatório registrar venda por venda.')+'</div><div class="formbox"><div class="section-title"><h3>'+title+'</h3></div><form id="ledgerForm"><div class="formgrid"><div class="span2"><label>Descrição</label><input class="field" name="description" required /></div><div><label>Valor</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required /></div><div><label>Data</label><input class="field" name="date" type="date" value="'+isoToday()+'" required /></div><div><label>Categoria</label><select class="field" name="category">'+cats.map(c=>'<option>'+c+'</option>').join('')+'</select></div><div><label>Forma</label><select class="field" name="method"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Transferência</option><option>Outro</option></select></div></div><div class="form-actions"><button class="btn" type="submit">Salvar</button></div></form></div><div class="section-title"><h3>'+listTitle+'</h3></div><div class="list">'+(arr.length?arr.map(x=>{const isFuel=type==='expenses'&&fuelExpenseIds.has(x.id);return '<div class="row"><div><div class="title">'+esc(x.description)+'</div><div class="sub">'+esc(x.category)+' · '+esc(x.payment_method||'')+(isFuel?' · <span class="pill">⛽ Gasolina</span>':'')+'</div></div><div class="datecol">'+dbr(x.occurred_at)+'</div><div class="money">'+money(x.amount)+'</div><div class="actions">'+(isFuel?'<button class="btn secondary small" data-go-gas="1">Abrir Gasolina</button>':'<button class="btn secondary small" data-edit-ledger="'+x.id+'">Editar</button><button class="btn danger small" data-del-ledger="'+x.id+'">Excluir</button>')+'</div></div>'}).join(''):'<div class="empty">Nenhum lançamento ainda.</div>')+'</div>';
  $('#ledgerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),obj={user_id:user.id,description:f.get('description'),amount:Number(f.get('amount')),occurred_at:f.get('date'),category:f.get('category'),payment_method:f.get('method')};const q=await sb.from(type).insert(obj);if(q.error)toast(q.error.message);else{toast('Lançamento salvo');await loadAll()}});
  document.querySelectorAll('[data-edit-ledger]').forEach(b=>b.addEventListener('click',()=>editLedger(type,b.dataset.editLedger,cats)));
  document.querySelectorAll('[data-del-ledger]').forEach(b=>b.addEventListener('click',()=>deleteRow(type,b.dataset.delLedger,'Excluir este lançamento?')));
