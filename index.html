function attachmentPaths(value){if(!value)return[];if(Array.isArray(value))return value.filter(Boolean);if(typeof value==='string'&&value.trim().startsWith('[')){try{const v=JSON.parse(value);return Array.isArray(v)?v.filter(Boolean):[value]}catch(e){}}return[String(value)]}
function attachmentValue(paths){const arr=(paths||[]).filter(Boolean);return arr.length?JSON.stringify(arr):null}
async function uploadAttachmentFiles(files,basePath){const list=Array.from(files||[]).filter(x=>x&&x.size),paths=[];for(const file of list){const ok=file.type==='application/pdf'||String(file.type||'').startsWith('image/');if(!ok){toast('Anexe apenas imagens ou PDFs.');if(paths.length)await sb.storage.from('financeiro').remove(paths);throw new Error('__VALIDATION__')}const path=basePath+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('financeiro').upload(path,file,{contentType:file.type||undefined,upsert:false});if(up.error){if(paths.length)await sb.storage.from('financeiro').remove(paths);throw up.error}paths.push(path)}return paths}
async function savePayable(e){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));let attachment_path=null;const files=f.getAll('file');try{attachment_path=attachmentValue(await uploadAttachmentFiles(files,user.id+'/contas'))}catch(err){if(err.message!=='__VALIDATION__')toast('Erro ao anexar: '+err.message);return}const obj={user_id:user.id,supplier_id:f.get('supplier_id')||null,description:f.get('description'),document_number:f.get('document_number')||null,category:f.get('category'),original_amount:amount,current_amount:amount,due_date:f.get('due_date'),priority:f.get('priority'),notes:f.get('notes')||null,attachment_path};const q=await sb.from('accounts_payable').insert(obj);if(q.error)toast(q.error.message);else{toast('Conta salva');await loadAll()}}
function bindPayableEvents(){document.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>payModal(b.dataset.pay)));document.querySelectorAll('[data-history]').forEach(b=>b.addEventListener('click',()=>paymentHistory(b.dataset.history)));document.querySelectorAll('[data-delpay]').forEach(b=>b.addEventListener('click',()=>deleteRow('accounts_payable',b.dataset.delpay,'Excluir esta conta?')));document.querySelectorAll('[data-editpay]').forEach(b=>b.addEventListener('click',()=>editPayable(b.dataset.editpay)))}
async function syncPayableStatus(id){const p=data.payables.find(x=>x.id===id);if(!p)return;const {data:rows,error}=await sb.from('payments').select('amount').eq('payable_id',id);if(error){toast(error.message);return}const paid=(rows||[]).reduce((a,b)=>a+Number(b.amount||0),0),total=Number(p.current_amount||0),status=paid>=total-.005?'paid':paid>0?'partial':(p.due_date<isoToday()?'overdue':'open');const q=await sb.from('accounts_payable').update({status}).eq('id',id);if(q.error)toast(q.error.message)}
function validReceiptFile(file){
  if(!file||!file.size)return true;
  const okType=file.type==='application/pdf'||String(file.type||'').startsWith('image/');
  if(!okType){toast('Anexe uma imagem ou PDF.');return false}
  if(file.size>10*1024*1024){toast('O comprovante deve ter no máximo 10 MB.');return false}
  return true
}
async function uploadPaymentReceipt(file,payableId){
  if(!file||!file.size)return null;
  if(!validReceiptFile(file))throw new Error('__VALIDATION__');
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=user.id+'/pagamentos/'+payableId+'/'+crypto.randomUUID()+'-'+safe;
  const up=await sb.storage.from('financeiro').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(up.error)throw up.error;
  return path
}
async function openPaymentReceipt(path){const paths=attachmentPaths(path);if(!paths.length){toast('Este registro não possui anexo.');return}for(const p of paths){const tab=window.open('about:blank','_blank'),q=await sb.storage.from('financeiro').createSignedUrl(p,120);if(q.error){if(tab)tab.close();toast('Não foi possível abrir o anexo: '+q.error.message);continue}if(tab)tab.location.href=q.data.signedUrl;else window.location.href=q.data.signedUrl}}
async function payModal(id){
  const p=data.payables.find(x=>x.id===id);if(!p)return;
  const bal=payableBal(p),paid=paidFor(id),total=Number(p.current_amount||0);
  if(bal<=.005){toast('Esta conta já está totalmente paga.');return}
  const methods=[['Pix','Pix'],['Dinheiro','Dinheiro'],['Débito','Débito'],['Crédito','Crédito'],['Boleto','Boleto'],['Transferência','Transferência'],['Outro','Outro']];
  openEditor('Registrar pagamento',
    '<div class="span3 summary-box"><div class="sub">'+esc(p.description)+'</div><div class="big">Falta '+money(bal)+'</div><div class="sub">Total '+money(total)+' · Já pago '+money(paid)+'</div></div>'+ 
    '<div><label>Quanto paguei agora?</label><input class="field" name="amount" type="number" min="0.01" max="'+bal.toFixed(2)+'" step="0.01" required value="'+bal.toFixed(2)+'" /></div>'+ 
    '<div><label>Data do pagamento</label><input class="field" name="paid_at" type="date" required value="'+isoToday()+'" /></div>'+ 
    '<div><label>Forma de pagamento</label><select class="field" name="method">'+opts(methods,'Pix')+'</select></div>'+ 
    '<div><label>Conta / origem (opcional)</label><input class="field" name="source_account" placeholder="Ex.: Caixa, Banco, Cartão" /></div>'+ 
    '<div class="span2"><label>Foto / comprovante do pagamento</label><input class="field" name="receipt_file" type="file" multiple accept="image/*,.pdf,application/pdf" /><div class="field-note">Pode anexar foto, print do Pix ou PDF. Máximo de 10 MB.</div></div>'+ 
    '<div class="span3"><label>Observação</label><input class="field" name="notes" placeholder="Ex.: primeira parte do boleto" /></div>',
    async f=>{
      const amount=Number(f.get('amount'));
      if(!amount||amount<=0||amount>bal+.005){toast('Informe um valor entre R$ 0,01 e '+money(bal)+'.');return false}
      const files=f.getAll('receipt_file');
      let attachment_path=null;
      try{attachment_path=attachmentValue(await uploadAttachmentFiles(files,user.id+'/pagamentos/'+id))}catch(err){if(err.message==='__VALIDATION__')return false;toast('Erro ao anexar comprovante: '+err.message);return false}
      const payload={user_id:user.id,payable_id:id,amount,paid_at:f.get('paid_at'),method:f.get('method')||null,source_account:String(f.get('source_account')||'').trim()||null,notes:String(f.get('notes')||'').trim()||null,attachment_path};
      const q=await sb.from('payments').insert(payload);
      if(q.error){if(attachment_path)await sb.storage.from('financeiro').remove(attachmentPaths(attachment_path));toast(q.error.message);return false}
      await syncPayableStatus(id);
      toast(amount>=bal-.005?'Conta quitada e comprovante salvo!':'Pagamento parcial registrado');
      await loadAll();
      if(page==='taxes') renderTaxes();
      return true
    }
  )
}

  function row(p){
    const s=data.suppliers.find(x=>x.id===p.supplier_id);

  }
  function paint(){
    const q=String(search.value||'').trim().toLowerCase();

      const s=data.suppliers.find(x=>x.id===p.supplier_id);
      const hay=[s?s.name:'',p.description||'',p.document_number||'',p.category||''].join(' ').toLowerCase();

function paymentHistory(id){
  const p=data.payables.find(x=>x.id===id);if(!p)return;
  const rows=data.payments.filter(x=>x.payable_id===id).sort((a,b)=>String(b.paid_at||'').localeCompare(String(a.paid_at||''))||String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const total=Number(p.current_amount||0),paid=paidFor(id),bal=payableBal(p),pct=total?Math.min(100,paid/total*100):0;
  const html='<div class="span3 summary-box"><div class="sub">'+esc(p.description)+'</div><div class="big">'+pct.toFixed(0)+'% pago</div><div class="sub">Já pago '+money(paid)+' · Falta '+money(bal)+' · Total '+money(total)+'</div><div class="pay-progress '+(pct>=99.995?'complete':'')+'" style="margin-top:10px"><span style="width:'+pct+'%"></span></div></div>'+ 
    '<div class="span3"><label>Histórico de pagamentos</label><div class="history-list">'+(rows.length?rows.map(x=>'<div class="history-item"><div><strong>'+dbr(x.paid_at)+'</strong><div class="meta">'+esc(x.method||'Forma não informada')+(x.source_account?' · '+esc(x.source_account):'')+(x.notes?' · '+esc(x.notes):'')+'</div>'+(x.attachment_path?'<div class="meta" style="margin-top:6px">📎 Comprovante anexado</div>':'')+'</div><div><div class="amount">'+money(x.amount)+'</div><div class="actions" style="margin-top:6px">'+(x.attachment_path?'<button type="button" class="btn secondary small" data-openreceipt="'+x.id+'">Ver comprovante</button>':'')+'<button type="button" class="btn secondary small" data-editpayment="'+x.id+'">Editar</button><button type="button" class="btn danger small" data-delpayment="'+x.id+'">Excluir</button></div></div></div>').join(''):'<div class="history-empty">Nenhum pagamento registrado ainda.</div>')+'</div></div>';
  openEditor('Pagamentos da conta',html,async()=>true);const editSave=$('#editSave');const editCancel=$('#editCancel');if(editSave)editSave.classList.add('hidden');if(editCancel)editCancel.textContent='Fechar';
  document.querySelectorAll('[data-openreceipt]').forEach(b=>b.addEventListener('click',()=>{const payment=data.payments.find(x=>x.id===b.dataset.openreceipt);if(payment)openPaymentReceipt(payment.attachment_path)}));
  document.querySelectorAll('[data-editpayment]').forEach(b=>b.addEventListener('click',()=>{closeEditor();setTimeout(()=>editPayment(b.dataset.editpayment),20)}));
  document.querySelectorAll('[data-delpayment]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Excluir este pagamento? O saldo da conta será recalculado.'))return;
    const payment=data.payments.find(x=>x.id===b.dataset.delpayment);
    const q=await sb.from('payments').delete().eq('id',b.dataset.delpayment);
    if(q.error){toast(q.error.message);return}
    if(payment?.attachment_path)await sb.storage.from('financeiro').remove(attachmentPaths(payment.attachment_path));
    await syncPayableStatus(payment.payable_id);toast('Pagamento excluído e saldo recalculado');closeEditor();await loadAll()
  }))
}
function editPayment(paymentId){
  const x=data.payments.find(r=>r.id===paymentId);if(!x)return;
  const p=data.payables.find(r=>r.id===x.payable_id);if(!p)return;
  const otherPaid=data.payments.filter(r=>r.payable_id===p.id&&r.id!==paymentId).reduce((a,b)=>a+Number(b.amount||0),0),max=Math.max(.01,Number(p.current_amount||0)-otherPaid);
  const methods=[['Pix','Pix'],['Dinheiro','Dinheiro'],['Débito','Débito'],['Crédito','Crédito'],['Boleto','Boleto'],['Transferência','Transferência'],['Outro','Outro']];
  openEditor('Editar pagamento',
    '<div class="span3 edit-hint">Você pode corrigir o pagamento e também trocar ou remover o comprovante anexado.</div>'+ 
    '<div><label>Valor</label><input class="field" name="amount" type="number" min="0.01" max="'+max.toFixed(2)+'" step="0.01" required value="'+Number(x.amount||0).toFixed(2)+'" /></div>'+ 
    '<div><label>Data</label><input class="field" name="paid_at" type="date" required value="'+esc(x.paid_at||isoToday())+'" /></div>'+ 
    '<div><label>Forma</label><select class="field" name="method">'+opts(methods,x.method||'Pix')+'</select></div>'+ 
    '<div><label>Conta / origem</label><input class="field" name="source_account" value="'+esc(x.source_account||'')+'" /></div>'+ 
    '<div class="span2"><label>'+(x.attachment_path?'Substituir comprovante':'Anexar comprovante')+'</label><input class="field" name="receipt_file" type="file" multiple accept="image/*,.pdf,application/pdf" /><div class="field-note">Foto, print do Pix ou PDF · máximo 10 MB.</div>'+(x.attachment_path?'<label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px"><input type="checkbox" name="remove_receipt" /> Remover comprovante atual</label>':'')+'</div>'+ 
    '<div class="span3"><label>Observação</label><input class="field" name="notes" value="'+esc(x.notes||'')+'" /></div>',
    async f=>{
      const amount=Number(f.get('amount'));if(!amount||amount<=0||amount>max+.005){toast('Valor inválido. O máximo para este pagamento é '+money(max)+'.');return false}
      const files=f.getAll('receipt_file');
      const oldPaths=attachmentPaths(x.attachment_path),remove=f.get('remove_receipt')==='on';let newPaths=[],attachment_path=remove?null:x.attachment_path;
      if(files.some(v=>v&&v.size)){try{newPaths=await uploadAttachmentFiles(files,user.id+'/pagamentos/'+p.id);attachment_path=attachmentValue(newPaths)}catch(err){if(err.message==='__VALIDATION__')return false;toast('Erro ao anexar comprovante: '+err.message);return false}}
      const q=await sb.from('payments').update({amount,paid_at:f.get('paid_at'),method:f.get('method')||null,source_account:String(f.get('source_account')||'').trim()||null,notes:String(f.get('notes')||'').trim()||null,attachment_path}).eq('id',paymentId);
      if(q.error){if(newPaths.length)await sb.storage.from('financeiro').remove(newPaths);toast(q.error.message);return false}
      if(remove&&oldPaths.length)await sb.storage.from('financeiro').remove(oldPaths);
      await syncPayableStatus(p.id);toast('Pagamento atualizado');await loadAll();return true
    }
  )
}

    '<div><label>Substituir anexo</label><input class="field" name="file" type="file" multiple accept="image/*,.pdf" /><div class="field-note">Se não escolher arquivo, o anexo atual será mantido.</div></div>'+ 
    '<div class="span3"><label>Observação</label><textarea class="field" name="notes">'+esc(p.notes||'')+'</textarea></div>'+ 
    '<div class="span3 edit-hint">Já pago nesta conta: <strong>'+money(paid)+'</strong>. O novo valor total não pode ficar abaixo desse valor.</div>',
    async f=>{
      const amount=Number(f.get('amount'));if(!amount||amount<paid-.005){toast('O valor total não pode ser menor que o valor já pago.');return false}
      let attachment_path=p.attachment_path||null;const files=f.getAll('file');
      if(files.some(v=>v&&v.size)){try{attachment_path=attachmentValue(await uploadAttachmentFiles(files,user.id+'/contas'))}catch(err){if(err.message!=='__VALIDATION__')toast('Erro ao anexar: '+err.message);return false}}
      const balance=Math.max(0,amount-paid);const payload={supplier_id:f.get('supplier_id')||null,description:String(f.get('description')||'').trim(),document_number:f.get('document_number')||null,category:f.get('category'),original_amount:amount,current_amount:amount,due_date:f.get('due_date'),priority:f.get('priority'),notes:f.get('notes')||null,attachment_path,status:balance<=.005?'paid':paid>0?'partial':'open'};
      if(!payload.description){toast('Preencha a descrição.');return false}
      const q=await sb.from('accounts_payable').update(payload).eq('id',id);if(q.error){toast(q.error.message);return false}toast('Conta atualizada');await loadAll();return true
    });

function fuelMonthlyIncome(m){return data.income.filter(x=>monthKey(x.occurred_at)===m).reduce((a,b)=>a+Number(b.amount),0)+data.receivablePayments.filter(x=>monthKey(x.received_at)===m).reduce((a,b)=>a+Number(b.amount),0)}
async function uploadFuelReceipt(file,date){
  if(!file||!file.size)return null;
  if(!validReceiptFile(file))throw new Error('__VALIDATION__');
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=user.id+'/gasolina/'+date+'/'+crypto.randomUUID()+'-'+safe;
  const up=await sb.storage.from('financeiro').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(up.error)throw up.error;
  return path
}

async function saveFuel(e){

 btn.disabled=true;btn.textContent='Salvando...';let attachment_path=null;
 try{attachment_path=attachmentValue(await uploadAttachmentFiles(files,user.id+'/gasolina/'+date));const q=await sb.from('fuel_expenses').insert({user_id:user.id,amount,fueled_at:date,station:String(f.get('station')||'').trim()||null,payment_method:f.get('payment_method')||null,notes:String(f.get('notes')||'').trim()||null,attachment_path});if(q.error)throw q.error;toast('Abastecimento salvo');await loadAll()}catch(err){if(attachment_path)await sb.storage.from('financeiro').remove(attachmentPaths(attachment_path));if(err.message!=='__VALIDATION__')toast('Não foi possível salvar: '+err.message)}finally{btn.disabled=false;btn.textContent='Salvar abastecimento'}

function editFuel(id){
 const x=(data.fuel||[]).find(v=>v.id===id);if(!x)return;
 const methods=['Pix','Dinheiro','Débito','Crédito','Outro'].map(v=>[v,v]);
 openEditor('Editar abastecimento','<div><label>Valor</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required value="'+Number(x.amount||0).toFixed(2)+'" /></div><div><label>Data</label><input class="field" name="fueled_at" type="date" required value="'+esc(x.fueled_at||'')+'" /></div><div><label>Posto</label><input class="field" name="station" value="'+esc(x.station||'')+'" /></div><div><label>Pagamento</label><select class="field" name="payment_method">'+opts(methods,x.payment_method||'')+'</select></div><div class="span2"><label>Substituir comprovante</label><input class="field" name="file" type="file" multiple accept="image/*,.pdf,application/pdf" />'+(x.attachment_path?'<label style="font-weight:500;margin-top:8px"><input type="checkbox" name="remove_receipt" /> Remover comprovante atual</label>':'')+'</div><div class="span3"><label>Observação</label><textarea class="field" name="notes">'+esc(x.notes||'')+'</textarea></div>',async f=>{
  const amount=Number(f.get('amount'));if(!amount||amount<=0){toast('Informe um valor válido.');return false}
  const files=f.getAll('file'),oldPaths=attachmentPaths(x.attachment_path),remove=f.get('remove_receipt')==='on';let attachment_path=remove?null:x.attachment_path,newPaths=[];
  try{if(files.some(v=>v&&v.size)){newPaths=await uploadAttachmentFiles(files,user.id+'/gasolina/'+f.get('fueled_at'));attachment_path=attachmentValue(newPaths)}const q=await sb.from('fuel_expenses').update({amount,fueled_at:f.get('fueled_at'),station:String(f.get('station')||'').trim()||null,payment_method:f.get('payment_method')||null,notes:String(f.get('notes')||'').trim()||null,attachment_path}).eq('id',id);if(q.error)throw q.error;if(remove&&oldPaths.length)await sb.storage.from('financeiro').remove(oldPaths);toast('Abastecimento atualizado');await loadAll();return true}catch(err){if(newPaths.length)await sb.storage.from('financeiro').remove(newPaths);if(err.message!=='__VALIDATION__')toast('Não foi possível atualizar: '+err.message);return false}

async function deleteFuel(id){
 const x=(data.fuel||[]).find(v=>v.id===id);if(!x)return;
 const label=(x.station||'Posto não informado')+' · '+money(x.amount)+' · '+dbr(x.fueled_at);

 const q=await sb.rpc('delete_fuel_expense',{p_id:id});
 if(q.error){toast('Não foi possível excluir: '+q.error.message);return}

 if(!result.ok){toast(result.message||'Não foi possível excluir este abastecimento.');return}
